name: StableKite strict Pyright

on:
  push:
    branches:
      - stablekite/typing-pyright-ci
  workflow_dispatch:

jobs:
  strict-installed-consumer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install latest unpinned released packages and Pyright
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pyright winrt-runtime winrt-Windows.Foundation winrt-Windows.Foundation.Collections winrt-Windows.Devices.Radios winrt-Windows.Devices.Enumeration winrt-Windows.Devices.Bluetooth winrt-Windows.Devices.Bluetooth.Advertisement winrt-Windows.Devices.Bluetooth.GenericAttributeProfile winrt-Windows.Storage.Streams
          python -m pyright --version
      - name: Verify installed typing payload and runtime imports
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\audit.py", [Convert]::FromBase64String(""))
          python "$env:RUNNER_TEMP\audit.py"
      - name: Strict StableKite WinRT consumer
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\consumer.py", [Convert]::FromBase64String(""))
          $cfg = [ordered]@{ typeCheckingMode = 'strict'; pythonPlatform = 'Windows'; include = @('consumer.py') }
          $cfg | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath "$env:RUNNER_TEMP\pyrightconfig.json" -Encoding UTF8
          Push-Location $env:RUNNER_TEMP
          try {
            python consumer.py
            python -m pyright --version
            python -m pyright --pythonpath (Get-Command python).Source --project pyrightconfig.json
          } finally {
            Pop-Location
          }
